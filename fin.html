function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return freshState();
    const n = JSON.parse(raw);
    return {

}
function freshState() {

    perfil: { ...DEFAULT_PERFIL }, pesos: [], comidasHoy: [],
    biblioteca: BIBLIOTECA_DEFAULT, medidasHist: [], entrenos: [],
    ejTab:"manual", ejInventario:{pesoCorporal:true,bandaSuave:true,bandaMedia:true,bandaFuerte:false,mancuernas:true,barra:false,banco:false},

    ejChat:[{role:"ia",text:"Soy tu Coach Fuerza. Dime tu inventario y test. Ej: 'Solo hago 6 flexiones' o 'peso recomendado hombro 5kg'. Te armo series x reps según tu nivel."}],
    fotos: [], histCal: [], tdeeReal: null, combos: [], activeTab: "home"
  };
}
function saveState(state) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { console.warn("saveState", e); }
}

function calcBMR(p) {
  const peso = parseFloat((p.peso||"").replace(",", "."));
  const altura = parseFloat((p.altura||"").replace(",", "."));
  const edad = parseFloat((p.edad||"").replace(",", "."));
  if (!peso || !altura || !edad || !p.sexo) return null;
  const base = 10*peso + 6.25*altura - 5*edad;
  return p.sexo === "Hombre" ? base + 5 : base - 161;
}
function factorActividad(a) {
  return ({ Sedentario:1.2, Ligero:1.375, Moderado:1.55, Activo:1.725 })[a] || 1.2;
}
function parseQuantityToGrams(q) {
  if (!q) return null;
  const s = String(q).toLowerCase();
  let m = s.match(/([\d.,]+)\s*kg/); if (m) { const v=parseFloat(m[1].replace(",",".")); if(!isNaN(v)) return v*1000; }
  m = s.match(/([\d.,]+)\s*g/); if (m) { const v=parseFloat(m[1].replace(",",".")); if(!isNaN(v)&&v<10000) return v; }
  m = s.match(/(\d+)\s*x\s*([\d.,]+)/); if (m) { const v=parseFloat(m[2].replace(",",".")); if(!isNaN(v)) return v; }
  return null;
}
function buildUnits(name, quantity, gramosBase) {
  const n = (name||"").toLowerCase();
  const has = (s) => n.includes(s);
  const units = [];
  if (has("huevo")) units.push({label:"pequeño (38g)",g:38},{label:"mediano (50g)",g:50},{label:"grande (60g)",g:60},{label:"extra grande (68g)",g:68});
  else if (has("plátano")||has("platano")) units.push({label:"pequeño (80g)",g:80},{label:"mediano (120g)",g:120},{label:"grande (150g)",g:150});
  else if (has("manzana")) units.push({label:"pequeño (100g)",g:100},{label:"mediano (150g)",g:150},{label:"grande (200g)",g:200});
  else if (has("pan")) units.push({label:"rebanada (30g)",g:30},{label:"mediano (60g)",g:60},{label:"grande (90g)",g:90});
  else {
    const q = parseQuantityToGrams(quantity);
    if (q && q > 0 && q < 5000) units.push({label:`unidad (${q}g)`,g:q});
    if (gramosBase) units.push({label:`ración (${gramosBase}g)`,g:gramosBase});
    units.push({label:"pequeño",g:50},{label:"mediano",g:100},{label:"grande",g:150},{label:"extra grande",g:200});
  }
  units.push({label:"g",g:1},{label:"porción (50g)",g:50},{label:"porción (100g)",g:100},{label:"porción (150g)",g:150});
  const seen = new Set();
  return units.filter(u => seen.has(u.label) ? false : (seen.add(u.label), true));
}

// ==== Funciones Coach Fuerza (portadas de 1.html) ====
function nivelPorFlexiones(flex) {
  if (flex == null) return null;
  if (flex < 5) return "Principiante";
  if (flex <= 15) return "Intermedio";
  return "Avanzado";
}

function parseListaMancuernas(str) {
  const arr = String(str||"").split(/[ ,]+/).map(x => parseFloat(String(x).replace(",", "."))).filter(x => !isNaN(x) && x > 0);
  return arr.length ? arr : [5];
}

function respuestaCoachFuerza(pregunta, ctx) {
  const { test, inventario, mancuernasKg, objetivo } = ctx;
  const q = (pregunta||"").toLowerCase();
  const flex = test?.flex ?? null;
  const sent = test?.sent ?? null;
  const plancha = test?.plancha ?? null;
  const curlPeso = test?.curlPeso ?? null;
  const curlReps = test?.curlReps ?? null;
  const mancuernas = parseListaMancuernas(mancuernasKg);
  const rango = objetivo === "Perder" ? "12-15 reps (resistencia)" : objetivo === "Ganar músculo" ? "8-12 reps (hipertrofia)" : "8-15 reps";

  if (q.includes("flexion")) {
    if (flex != null) {
      if (flex <= 2) return `Con ${flex} de máximo: 6 series de 1-2 reps, 90s descanso, apoyando rodillas. Objetivo: llegar a 5x3 esta semana. 3 días/semana.`;
      if (flex <= 6) return `Con ${flex} de máximo: 5 series de 3-4 reps, 90s descanso. Cuando hagas 5x5 subimos a pies elevados. 3 días/semana.`;
      if (flex <= 10) return `Con ${flex} flexiones eres Intermedio: 4 series de 6-8 reps, 90s. Progresión: 4x8 → pies elevados 4x6 → lastre mochila.`;
      return `Con ${flex}+ flexiones eres Avanzado: pies elevados 4x8, 90s, o arquero 3x6 por lado. Añade 2s pausa abajo.`;
    }
    return "Haz el test de flexiones arriba y guárdalo. Si haces 6, pauta base 5x3-4 con 90s.";
  }

  if (q.includes("mancuerna") && q.includes("hombro")) {
    const primera = mancuernas[0];
    return `Hombro con ${primera}kg: press 3x12, elev lateral 3x12-15 tempo 3-0-1-0. Si haces 15 fácil, sube a 8-10kg. Objetivo actual ${rango}.`;
  }

  if (q.includes("banda") && q.includes("pecho")) {
    return `Banda media ≈ 8-12kg según estiramiento. Press pecho anclada 4x15, 60s descanso, banda tensa al final. Si es suave, 4x20; si es fuerte, 4x12 con 90s.`;
  }

  if (q.includes("banda")) {
    return `Bandas: suave 4-6kg, media 8-12kg, fuerte 14-20kg según estiramiento. Rutina 20min: Press pecho 4x15 + Remo 4x15 + Sentadilla 3x15 + Plancha 3x30s. 60-75s descanso.`;
  }

  if ((q.includes("cuantas") || q.includes("cuántas")) && (q.includes("serie") || q.includes("repeticion") || q.includes("repetición"))) {
    if (q.includes("sentadilla")) {
      if (sent != null) {
        if (sent < 10) return `Con ${sent} sentadillas max: 5x5 profundas, 90s. Cuando llegues a 5x12 pasa a búlgara o lastre.`;
        if (sent < 25) return `Con ${sent} sentadillas: 4x12-15, 75s. Progresión: 4x15 → 3x8 búlgara por pierna.`;
        return `Con ${sent}+ sentadillas: 4x10 búlgaras + 3x12 sentadilla banda fuerte. Añade pausa 2s abajo.`;
      }
    }
    return `Rangos: Fuerza 3-6 reps (3-5 series, 2-3min descanso), Hipertrofia 8-12 reps (3-4 series, 75-90s), Resistencia 12-20 reps (3-4 series, 60s). Tu objetivo ${objetivo||"-"} → ${rango}.`;
  }

  if (q.includes("peso recomendado") || (q.includes("peso") && q.includes("recomendado"))) {
    if (curlPeso != null && curlReps != null) {
      const vol = curlPeso * curlReps;
      if (curlReps >= 15) return `Curl ${curlPeso}kg x ${curlReps} reps = volumen alto. Sube a ${curlPeso+2}kg buscando 8-12 reps. Hombro ≈ ${(curlPeso*0.6).toFixed(1)}kg, pecho/remo ≈ ${(curlPeso*2).toFixed(0)}kg banda.`;
      if (curlReps < 8) return `Curl ${curlPeso}kg x ${curlReps} reps = fuerza. Baja a ${Math.max(2,curlPeso-1)}kg para 10-12 reps. Hombro ≈ ${(curlPeso*0.6).toFixed(1)}kg.`;
      return `Curl ${curlPeso}kg x ${curlReps} reps en rango hipertrofia. Hombro ≈ ${(curlPeso*0.7).toFixed(1)}kg, remo ≈ ${(curlPeso*1.8).toFixed(0)}kg.`;
    }
    return `Haz el test de curl (peso y reps). Ej: 5kg x 12 → hombro ~3kg, espalda ~10kg. Con mancuernas ${mancuernas.join(", ")}kg elige el que te deje a 2 reps del fallo en rango ${rango}.`;
  }

  if (q.includes("sentadilla")) {
    if (sent != null) {
      if (sent < 10) return `Sentadillas max ${sent}: 5x5, 90s, profunda. Cuando llegues a 5x10, sube a búlgaras 3x8/pierna.`;
      if (sent < 25) return `Sentadillas max ${sent}: 4x12-15, 75s. Alterna con peso muerto banda 3x15. Objetivo ${rango}.`;
      return `Sentadillas max ${sent}: búlgaras 4x8 + sentadilla banda fuerte 3x12 + plancha 3x30s.`;
    }
    return "Dime tu max sentadillas del test. Base: 20 → 4x12 con 75s; 6 → 5x3-4.";
  }

  if (q.includes("rutina") && (q.includes("20min") || q.includes("20 min") || q.includes("banda"))) {
    const items = [];
    if (inventario.pesoCorporal) items.push("flexiones 4x8");
    if (inventario.bandaMedia || inventario.bandaSuave) items.push("press pecho banda 4x15 + remo banda 4x15");
    if (inventario.mancuernas) items.push(`press hombro ${mancuernas[0]}kg 3x12 + elev lateral 3x12-15`);
    if (inventario.banco) items.push("fondos banco 3x10");
    return `Rutina 20min con lo que tienes (${items.join(", ")}). Bloque 1 (8min) Press pecho + Remo. Bloque 2 (7min) Sentadilla 4x15 + Plancha banda 3x30s. Bloque 3 (5min) ${inventario.mancuernas ? `Elev lateral ${mancuernas[0]}kg 3x15 lento` : "Flexiones 3x al fallo -1"}. 60s entre bloques.`;
  }

  if (!test) {
    return `Completa el test inicial arriba (flexiones, sentadillas, plancha, curl) y guarda. Tu objetivo ${objetivo||"-"} pide ${rango}. Inventario: ${Object.entries(inventario).filter(([,v])=>v).map(([k])=>k).join(", ")} · Mancuernas ${mancuernas.join("/")}kg.`;
  }

  return `Con tu test (flex ${flex??"-"}, sent ${sent??"-"}, plancha ${plancha??"-"}s, curl ${curlPeso??"-"}kg x ${curlReps??"-"}), nivel ${test.nivel}. Recomendación ${rango}, 3 días Push/Pull/Legs. Pregunta por músculo: "flexiones", "sentadillas", "peso recomendado", "rutina 20min con bandas".`;
}

  { id:"peso", title:"Mi Peso", icon:"⚖️", desc:(s)=>s.pesos.length?`${s.pesos[s.pesos.length-1].peso.toFixed(1)} kg · ${s.pesos.length} registros`:"Sin datos aún" },

const NAV = [
  { id:"home", label:"Mi", icon:"🏠" },
  { id:"peso", label:"Peso", icon:"⚖️" },
  { id:"objetivo", label:"Objetivo", icon:"🎯" },
  { id:"perfil", label:"Perfil", icon:"👤" },
  { id:"calculadora", label:"Calculadora", icon:"⏱️" },
  { id:"comidas", label:"Comidas", icon:"🍽️" },
  { id:"entrenos", label:"Entrenos", icon:"💪" },
  { id:"tdee", label:"TDEE", icon:"🔥" },
  { id:"balance", label:"Balance", icon:"📊" }
];

function App() {
  const [state, setState] = useState(loadState);
  const [tab, setTab] = useState(state.activeTab || "home");
  const [perfil, setPerfil] = useState(state.perfil);
  const [comidaTab, setComidaTab] = useState("buscar");
  const [query, setQuery] = useState("");
  const [soloMercadona, setSoloMercadona] = useState(true);
  const [loading, setLoading] = useState(false);
  const [resultados, setResultados] = useState([]);
  const [selected, setSelected] = useState(null);
  const [cantidad, setCantidad] = useState(1);
  const [unidadIdx, setUnidadIdx] = useState(0);
  const [codeInput, setCodeInput] = useState("");
  const [loadingCode, setLoadingCode] = useState(false);
  const [manual, setManual] = useState({ nombre:"", kcal100:"", gramos:"" });
  const [pesoInput, setPesoInput] = useState("");
  const [medidas, setMedidas] = useState({ cintura:"", cuello:"", cadera:"" });
  const [entreno, setEntreno] = useState({ tipo:"Correr", minutos:"30", kcal:"250" });
  const [calc, setCalc] = useState({ kg:"5", dias:"60", tdee:"2200", fecha:"", modo:"dias" });
  const [scanning, setScanning] = useState(false);
  const videoRef = useRef(null);
  const streamRef = useRef(null);

  // ==== Estados específicos de entrenamientos ====
  const [ejManualMin, setEjManualMin] = useState("35");
  const [ejManualPeso, setEjManualPeso] = useState("");
  const [ejActividad, setEjActividad] = useState("Correr suave");
  const [ejChatInput, setEjChatInput] = useState("");
  const ejChatRef = useRef(null);
  const [ejImportMsg, setEjImportMsg] = useState(null);

  // Sync desde Supabase (solo si hay key)
  useEffect(() => {
    if (!SUPABASE_KEY) return;
    let cancel = false;
    (async () => {
      try {
        const r = await fetch(`${SUPABASE_URL}/rest/v1/app_data?id=eq.${RECORD_ID}&select=data`, {
          headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
        });
        if (!r.ok || cancel) return;
        const j = await r.json();
        if (j?.[0]?.data) {
          const remote = JSON.stringify(j[0].data);
          if (localStorage.getItem(STORAGE_KEY) !== remote && !sessionStorage.getItem("pp_synced")) {
            sessionStorage.setItem("pp_synced", "1");
            localStorage.setItem(STORAGE_KEY, remote);
            setState(loadState());
          }
        }
      } catch (e) { console.warn("Sync down error", e); }
    })();
    return () => { cancel = true; };
  }, []);

  useEffect(() => { saveState({ ...state, activeTab: tab }); }, [state, tab]);
  useEffect(() => { setState(s => ({ ...s, activeTab: tab })); }, [tab]);
  useEffect(() => { setPerfil(state.perfil); }, [state.perfil]);

  // Búsqueda OpenFoodFacts
  useEffect(() => {
    if (tab !== "comidas" || comidaTab !== "buscar") return;
    if (!query.trim()) { setResultados([]); return; }
    let cancel = false;
    const t = setTimeout(async () => {
      setLoading(true);
      try {
        const base = "https://world.openfoodfacts.org/cgi/search.pl";
        const params = new URLSearchParams({
          search_terms: query.trim(), json: "true", page_size: "20",
          fields: "product_name,product_name_es,brands,code,nutriments,image_front_small_url,image_front_url,quantity"
        });
        let url = `${base}?${params.toString()}`;
        if (soloMercadona) url += "&tagtype_0=brands&tag_contains_0=contains&tag_0=Hacendado";
        let r = await fetch(url); let j = await r.json();
        let products = j.products || [];
        if (soloMercadona && products.length === 0) {
          params.set("search_terms", query.trim() + " hacendado");
          r = await fetch(`${base}?${params.toString()}`); j = await r.json();
          products = j.products || [];
        }
        if (!cancel) setResultados(products);
      } catch (e) { console.error(e); if (!cancel) setResultados([]); }
      finally { if (!cancel) setLoading(false); }
    }, 400);
    return () => { cancel = true; clearTimeout(t); };
  }, [query, soloMercadona, tab, comidaTab]);

  const bmr = useMemo(() => calcBMR(perfil), [perfil]);
  const tdee = useMemo(() => bmr ? Math.round(bmr * factorActividad(perfil.actividad)) : null, [bmr, perfil.actividad]);

  const unidades = useMemo(() => {
    if (!selected) return [];
    const name = selected.product_name || selected.product_name_es || selected.nombre || "";
    return buildUnits(name, selected.quantity || "", selected.gramosBase);
  }, [selected]);

  useEffect(() => {
    if (!selected) return;
    const name = (selected.product_name || "").toLowerCase();
    if (name.includes("huevo")) {
      setCantidad(3);
      const i = unidades.findIndex(u => u.label.includes("mediano"));
      setUnidadIdx(i >= 0 ? i : 0);
    } else {
      setCantidad(1);
      const i = unidades.findIndex(u => u.label.includes("mediano"));
      setUnidadIdx(i >= 0 ? i : 0);
    }
  }, [selected, unidades]);

  // Auto-scroll chat fuerza
  useEffect(() => {
    if (ejChatRef.current) ejChatRef.current.scrollIntoView({ behavior:"smooth" });
  }, [state.ejChat]);

  const unidadActual = unidades[unidadIdx] || { g:100, label:"g" };
  const gramosTotales = cantidad * unidadActual.g;
  const kcal100 = selected ? (
    selected.nutriments?.["energy-kcal_100g"] ||
    (selected.nutriments?.energy_100g ? selected.nutriments.energy_100g/4.184 : selected.kcal100) || 0
  ) : 0;
  const kcalTotales = kcal100 * gramosTotales / 100;

  const seleccionarProducto = (p) => {
    setSelected({
      product_name: p.product_name || p.product_name_es || p.nombre,
      brands: p.brands || p.marca || "",
      code: p.code || p.id,
      quantity: p.quantity || "",
      nutriments: p.nutriments || { "energy-kcal_100g": p.kcal100 || 0 },
      image_front_small_url: p.image_front_small_url || "",
      image_front_url: p.image_front_url || "",
      kcal100: p.kcal100,
      gramosBase: p.gramosBase
    });
  };

  const addComida = () => {
    if (!selected) return;
    const nombre = selected.product_name || selected.product_name_es || "Alimento";
    const nueva = {
      id: Date.now().toString(),
      nombre,
      gramos: Math.round(gramosTotales),
      kcal: Math.round(kcalTotales),
      fecha: new Date().toISOString().slice(0,10),
      marca: selected.brands,
      code: selected.code
    };
    setState(s => ({ ...s, comidasHoy: [...s.comidasHoy, nueva] }));
    setSelected(null);
  };

  const addBiblioteca = () => {
    if (!selected) return;
    const nombre = selected.product_name || selected.product_name_es || "Alimento";
    const nueva = {
      id: Date.now().toString(), nombre, kcal100: Math.round(kcal100),
      marca: selected.brands, gramosBase: unidadActual.g, code: selected.code
    };
    setState(s => ({ ...s, biblioteca: [nueva, ...s.biblioteca] }));
  };

  const buscarCodigo = async () => {
    const c = codeInput.trim();
    if (!c) return;
    setLoadingCode(true);
    try {
      const r = await fetch(`https://world.openfoodfacts.org/api/v0/product/${c}.json`);
      const j = await r.json();
      if (j.status === 1 && j.product) seleccionarProducto(j.product);
      else alert("Producto no encontrado");
    } catch { alert("Error buscando código"); }
    setLoadingCode(false);
  };

  const iniciarEscaner = async () => {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
      streamRef.current = stream;
      if (videoRef.current) { videoRef.current.srcObject = stream; await videoRef.current.play(); }
      setScanning(true);
      if ("BarcodeDetector" in window) {
        const detector = new window.BarcodeDetector({ formats: ["ean_13","ean_8","upc_a","upc_e"] });
        const loop = async () => {
          if (!streamRef.current) return;
          try {
            const codes = await detector.detect(videoRef.current);
            if (codes.length) {
              const code = codes[0].rawValue;
              setCodeInput(code);
              detenerEscaner();
              const r = await fetch(`https://world.openfoodfacts.org/api/v0/product/${code}.json`);
              const j = await r.json();
              if (j.status === 1 && j.product) seleccionarProducto(j.product);
              return;
            }
          } catch {}
          if (streamRef.current) requestAnimationFrame(loop);
        };
        loop();
      }
    } catch (e) { alert("No se pudo acceder a la cámara"); console.error(e); }
  };
  const detenerEscaner = () => {
    if (streamRef.current) streamRef.current.getTracks().forEach(t => t.stop());
    streamRef.current = null;
    if (videoRef.current) videoRef.current.srcObject = null;
    setScanning(false);
  };

  const guardarPerfil = () => {
    const b = calcBMR(perfil);
    setState(s => ({ ...s, perfil }));
    alert(`Perfil guardado. BMR: ${b ? b.toFixed(0) : "-"} kcal`);
    setTab("home");
  };
  const borrarTodo = () => {
    if (!confirm("¿Borrar todo y empezar de cero hoy? Se eliminarán pesos, comidas, medidas, entrenos y fotos.")) return;
    localStorage.removeItem(STORAGE_KEY);
    const fresh = freshState();
    setState(fresh); setPerfil(fresh.perfil); setTab("home");
    alert("Datos borrados");
  };

  const borrarItem = (key, id) => {
    if (!confirm("¿Eliminar este registro?")) return;
    setState(s => ({ ...s, [key]: s[key].filter(x => x.id !== id) }));
  };

  const addPeso = () => {
    const v = parseFloat(pesoInput.replace(",", "."));
    if (!v || v < 20 || v > 400) { alert("Peso inválido"); return; }
    setState(s => ({ ...s, pesos: [...s.pesos, { id: Date.now().toString(), fecha: new Date().toISOString().slice(0,10), peso: v }] }));
    setPesoInput("");
  };
  const addMedidas = () => {
    setState(s => ({ ...s, medidasHist: [...s.medidasHist, { id: Date.now().toString(), fecha: new Date().toISOString().slice(0,10), ...medidas }] }));
    setMedidas({ cintura:"", cuello:"", cadera:"" });
  };
  const addEntreno = () => {
    setState(s => ({ ...s, entrenos: [...s.entrenos, {
      id: Date.now().toString(), fecha: new Date().toISOString().slice(0,10),
      tipo: entreno.tipo, minutos: parseInt(entreno.minutos)||0, kcal: parseInt(entreno.kcal)||0
    }]}));
  };
  const addManual = () => {
    if (!manual.nombre || !manual.kcal100 || !manual.gramos) return;
    const k = parseFloat(manual.kcal100.replace(",", ".")) || 0;
    const g = parseFloat(manual.gramos.replace(",", ".")) || 0;
    setState(s => ({ ...s, comidasHoy: [...s.comidasHoy, {
      id: Date.now().toString(), nombre: manual.nombre, gramos: g,
      kcal: Math.round(k*g/100), fecha: new Date().toISOString().slice(0,10)
    }]}));
    setManual({ nombre:"", kcal100:"", gramos:"" });
  };

  const onFoto = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    if (file.size > 1.5 * 1024 * 1024) { alert("Imagen demasiado grande (máx 1.5 MB)"); return; }
    const reader = new FileReader();
    reader.onload = () => {
      setState(s => ({ ...s, fotos: [...s.fotos, { id: Date.now().toString(), fecha: new Date().toISOString().slice(0,10), data: reader.result }] }));
    };
    reader.readAsDataURL(file);
  };
  const borrarFoto = (id) => { if (confirm("¿Eliminar foto?")) setState(s => ({ ...s, fotos: s.fotos.filter(f => f.id !== id) })); };

  const plan = useMemo(() => {
    const kg = parseFloat(calc.kg.replace(",", ".")) || 0;
    const dias = parseFloat(calc.dias.replace(",", ".")) || 0;
    const tdeeVal = parseFloat(calc.tdee.replace(",", ".")) || 2000;
    let totalDias = dias, fechaFin = "";
    if (calc.modo === "fecha" && calc.fecha) {
      const hoy = new Date(); const fin = new Date(calc.fecha);
      const diff = Math.ceil((fin - hoy)/86400000);
      totalDias = diff > 0 ? diff : dias;
      fechaFin = calc.fecha;
    } else {
      const d = new Date(); d.setDate(d.getDate() + totalDias);
      fechaFin = d.toISOString().slice(0,10);
    }
    const totalKcal = kg * 7700;
    const deficit = totalDias > 0 ? totalKcal/totalDias : 0;
    const ingesta = tdeeVal - deficit;
    const ritmo = totalDias > 0 ? (kg/totalDias)*7 : 0;
    return { kg, dias: totalDias, tdee: tdeeVal, totalKcal, deficit, ingesta, fechaFin, ritmoSem: ritmo };
  }, [calc]);

  const hoy = new Date().toISOString().slice(0,10);
  const comidasHoy = state.comidasHoy.filter(c => c.fecha === hoy);
  const kcalHoy = Math.round(comidasHoy.reduce((a,c) => a + c.kcal, 0));
  const kcalQuemadasHoy = state.entrenos.filter(e => e.fecha === hoy).reduce((a,e) => a + e.kcal, 0);

  // ==== Cálculos entrenamientos ====
  const ejMinNum = parseFloat(ejManualMin.replace(",", ".")) || 0;
  const ejPesoNum = parseFloat(ejManualPeso.replace(",", ".")) || parseFloat((perfil.peso||"").replace(",", ".")) || 80;
  const ejMetActual = ACTIVIDADES_MET.find(a => a.nombre === ejActividad)?.met ?? 5;
  const ejKcalManual = (() => {
    let k = ejMetActual * ejPesoNum * ejMinNum / 60;
    if (ejActividad === "HIIT") k += k * 0.06; // EPOC
    return k;
  })();

  const ejNivel = state.ejTest?.nivel || null;
  const ejMancuernasArr = parseListaMancuernas(state.ejMancuernasKg);

  // ==== Header ====
  const header = h("header", { className:"sticky top-0 z-40 bg-[#FEF9F3]/90 backdrop-blur border-b border-[#F0E6DC]" },
    h("div", { className:"max-w-[980px] mx-auto px-4 py-3 flex items-center justify-between" },
      h("div", { className:"flex items-center gap-3" },
        tab !== "home" && h("button", { onClick:()=>setTab("home"), className:"w-8 h-8 rounded-full bg-white border border-[#F0E6DC] flex items-center justify-center font-bold", "aria-label":"Volver al inicio" }, "<"),
        h("div", { className:"font-extrabold tracking-widest text-[16px]" }, "PESOPRO"),
        h("div", { className:"hidden md:flex items-center gap-2" },
          h("span", { className:"text-[11px] px-2 py-1 rounded-full bg-white border border-[#F0E6DC] font-bold uppercase" }, tab==="home" ? "Menú" : (CARDS.find(c=>c.id===tab)?.title || tab)),
          h("span", { className:"text-[11px] px-2 py-1 rounded-full bg-[#2D4A3E] text-white font-bold" }, VERSION)
        )
      ),
      h("div", { className:"flex items-center gap-2" },
        h("span", { className:"md:hidden text-[11px] px-2 py-1 rounded-full bg-white border border-[#F0E6DC] font-bold uppercase" }, tab==="home" ? "Menú" : tab),
        h("span", { className:"text-[11px] px-2 py-1 rounded-full bg-[#2D4A3E] text-white font-bold" }, VERSION)
      )
    )
  );

  // ==== HOME ====
  const home = h("div", null,
    h("div", { className:"mb-5" },
      h("h1", { className:"text-[28px] font-extrabold tracking-tight leading-none" }, "PesoPro"),
      h("p", { className:"text-[13px] opacity-70 mt-2" }, "Tu app definitiva · Pulsa una tarjeta para entrar.")
    ),
    h("div", { className:"grid grid-cols-2 gap-3 md:grid-cols-4" },
      CARDS.map(c => h("button", {
        key:c.id, "data-testid":`card-${c.id}`,
        onClick:()=>{ setTab(c.id); window.scrollTo(0,0); },
        className:"text-left bg-white rounded-[20px] p-4 shadow-[0_8px_24px_rgba(0,0,0,.07)] border border-[#F0E6DC]/60 hover:shadow-[0_12px_32px_rgba(0,0,0,.10)] transition-all focus:outline-none focus:ring-2 active:scale-[0.97] cursor-pointer"
      },
        h("div", { className:"text-[22px]" }, c.icon),
        h("div", { className:"mt-2 font-extrabold text-[14px] leading-tight" }, c.title),
        h("div", { className:"mt-1 text-[11px] opacity-70 leading-tight line-clamp-2" }, c.desc(state)),
        h("div", { className:"mt-3 text-[10px] font-bold opacity-40" }, "ENTRAR →")
      ))
    ),
    h("div", { className:"mt-6 grid md:grid-cols-2 gap-3" },
      h("div", { className:"bg-white rounded-[20px] p-4 border border-[#F0E6DC] shadow-sm" },
        h("div", { className:"font-bold text-[13px]" }, "Resumen hoy"),
        h("div", { className:"mt-2 text-[12px] space-y-1" },
          h("div", null, "🔥 Ingesta: ", kcalHoy, " kcal · ", comidasHoy.length, " comidas"),
          h("div", null, "⚖️ Peso: ", state.pesos.length ? `${state.pesos[state.pesos.length-1].peso.toFixed(1)} kg` : "Sin datos"),
          h("div", null, "💪 Entreno: ", kcalQuemadasHoy, " kcal quemadas")
        )
      ),
      h("div", { className:"bg-[#2D4A3E] text-white rounded-[20px] p-4" },
        h("div", { className:"font-bold text-[13px]" }, "Consejo Pro"),
        h("div", { className:"mt-2 text-[12px] opacity-90" }, SUPABASE_KEY ? "Sincronización activa con Supabase." : "Sync opcional: pega tu SUPABASE_KEY en el código para sincronizar en la nube.")
      )
    )
  );

  // ==== PESO ====
  const peso = h("div", { className:"space-y-4" },
    h("div", { className:"bg-white rounded-[24px] p-4 shadow-[0_8px_24px_rgba(0,0,0,.07)]" },
      h("div", { className:"font-extrabold text-[16px]" }, "Mi Peso"),
      h("div", { className:"mt-3 flex gap-2" },
        h("input", { value:pesoInput, onChange:e=>{ if(/^[\d.,]*$/.test(e.target.value)) setPesoInput(e.target.value); }, placeholder:"Ej: 85.2", inputMode:"decimal", "aria-label":"Peso en kg", className:"flex-1 bg-[#FEF9F3] border border-[#F0E6DC] rounded-[12px] px-3 py-2 text-[13px]" }),
        h("button", { onClick:addPeso, className:"bg-[#2D4A3E] text-white rounded-[12px] px-4 py-2 font-bold text-[12px]" }, "Guardar")

  const parseTCX = (text) => {
    const totalTime = parseFloat((text.match(/<TotalTimeSeconds>([\d.]+)<\/TotalTimeSeconds>/)||[])[1] || "0");
    const dist = parseFloat((text.match(/<DistanceMeters>([\d.]+)<\/DistanceMeters>/)||[])[1] || "0");
    const avgHr = parseInt((text.match(/<AverageHeartRateBpm[^>]*>\s*<Value>(\d+)<\/Value>/)||[])[1] || "0");
    const maxHr = parseInt((text.match(/<MaximumHeartRateBpm[^>]*>\s*<Value>(\d+)<\/Value>/)||[])[1] || "0");
    const sport = ((text.match(/<Activity[^>]*Sport="([^"]+)"/)||[])[1] || "Other");
    const kcalXml = parseInt((text.match(/<Calories>(\d+)<\/Calories>/)||[])[1] || "0");
    return { totalTime, dist, avgHr, maxHr, sport, kcalXml };
  };

  const parseGPX = (text) => {
    const times = [...text.matchAll(/<time>([^<]+)<\/time>/g)].map(m => new Date(m[1]).getTime()).filter(t => !isNaN(t));
    let totalTime = 0;
    if (times.length >= 2) totalTime = Math.round((Math.max(...times) - Math.min(...times)) / 1000);
    const pts = [...text.matchAll(/<trkpt[^>]*lat="([\d.\-]+)"[^>]*lon="([\d.\-]+)"/g)].map(m => ({ lat: parseFloat(m[1]), lon: parseFloat(m[2]) }));
    let dist = 0;
    const R = 6371000;
    const toRad = (d) => d * Math.PI / 180;
    for (let i = 1; i < pts.length; i++) {
      const dLat = toRad(pts[i].lat - pts[i-1].lat);
      const dLon = toRad(pts[i].lon - pts[i-1].lon);
      const a = Math.sin(dLat/2)**2 + Math.cos(toRad(pts[i-1].lat)) * Math.cos(toRad(pts[i].lat)) * Math.sin(dLon/2)**2;
      dist += R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }
    return { totalTime, dist, avgHr: 0, maxHr: 0, sport: "Other", kcalXml: 0 };
  };

  const parseKML = (text) => {
    const times = [...text.matchAll(/<when>([^<]+)<\/when>/g)].map(m => new Date(m[1]).getTime()).filter(t => !isNaN(t));
    let totalTime = 0;
    if (times.length >= 2) totalTime = Math.round((Math.max(...times) - Math.min(...times)) / 1000);
    const coords = [...text.matchAll(/<coordinates>([^<]+)<\/coordinates>/g)]
      .flatMap(m => m[1].trim().split(/\s+/).map(c => {
        const [lon, lat] = c.split(",").map(parseFloat);
        return { lat, lon };
      })).filter(p => !isNaN(p.lat) && !isNaN(p.lon));
    let dist = 0;
    const R = 6371000;
    const toRad = (d) => d * Math.PI / 180;
    for (let i = 1; i < coords.length; i++) {
      const dLat = toRad(coords[i].lat - coords[i-1].lat);
      const dLon = toRad(coords[i].lon - coords[i-1].lon);
      const a = Math.sin(dLat/2)**2 + Math.cos(toRad(coords[i-1].lat)) * Math.cos(toRad(coords[i].lat)) * Math.sin(dLon/2)**2;
      dist += R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

    return { totalTime, dist, avgHr: 0, maxHr: 0, sport: "Other", kcalXml: 0 };

    )
  );

  // ==== COMIDAS ====
  const comidasView = h("div", { className:"space-y-4" },
    h("div", { className:"bg-white rounded-[24px] p-4 shadow-[0_8px_24px_rgba(0,0,0,.07)]" },
      h("div", { className:"font-extrabold text-[16px]" }, "Comidas"),
      h("div", { className:"mt-3 flex gap-2 overflow-x-auto pb-1" },
        [
          {id:"buscar",label:"🔍 Buscar Mercadona/OFF"},
          {id:"codigo",label:"📦 Código"},
          {id:"biblioteca",label:"📚 Biblioteca"},
          {id:"manual",label:"✍️ Manual"}
        ].map(t => h("button", { key:t.id, onClick:()=>setComidaTab(t.id), className:`whitespace-nowrap rounded-full border px-3 py-1.5 text-[12px] font-bold ${comidaTab===t.id?"bg-[#2D4A3E] text-white border-[#2D4A3E]":"bg-[#FEF9F3] border-[#F0E6DC]"}` }, t.label))
      ),
      comidaTab === "buscar" && h("div", { className:"mt-4 space-y-3" },
        h("input", { value:query, onChange:e=>setQuery(e.target.value), placeholder:"Buscar alimento... Ej: leche mercadona, huevo hacendado", className:"w-full bg-[#FEF9F3] border border-[#F0E6DC] rounded-[14px] px-4 py-3 text-[13px]" }),
        h("label", { className:"flex items-center gap-2 text-[12px]" },
          h("input", { type:"checkbox", checked:soloMercadona, onChange:e=>setSoloMercadona(e.target.checked) }),
          " Solo Mercadona/Hacendado"
        ),
        h("div", { className:"flex flex-wrap gap-2" },
          ["Leche Hacendado","Huevo","Pollo","Yogur griego"].map(s => h("button", { key:s, onClick:()=>setQuery(s), className:"rounded-full bg-white border border-[#F0E6DC] px-3 py-1 text-[11px] font-semibold" }, s))
        ),
        loading && h("div", { className:"text-[12px] opacity-60" }, "Buscando en OpenFoodFacts..."),
        h("div", { className:"grid gap-2" },
          resultados.map(p => h("button", { key:p.code, onClick:()=>seleccionarProducto(p), className:"text-left flex gap-3 bg-[#FEF9F3] rounded-[16px] p-3 border border-[#F0E6DC]/50" },
            h("img", { src:p.image_front_small_url || p.image_front_url || "", alt:"", className:"w-12 h-12 rounded-[10px] object-cover bg-white" }),
            h("div", { className:"flex-1 min-w-0" },
              h("div", { className:"font-bold text-[13px] truncate" }, p.product_name || p.product_name_es),
              h("div", { className:"text-[11px] opacity-70 truncate" }, p.brands),
              h("div", { className:"text-[11px] font-semibold mt-1" }, p.nutriments?.["energy-kcal_100g"] ? `${Math.round(p.nutriments["energy-kcal_100g"])} kcal/100g` : (p.nutriments?.energy_100g ? `${Math.round(p.nutriments.energy_100g/4.184)} kcal/100g` : ""))
            )
          )),
          query && !loading && resultados.length === 0 && h("div", { className:"text-[12px] opacity-60" }, "Sin resultados. Prueba con otro término.")
        )
      ),
      comidaTab === "codigo" && h("div", { className:"mt-4 space-y-3" },
        h("div", { className:"flex gap-2" },
          h("input", { value:codeInput, onChange:e=>setCodeInput(e.target.value), placeholder:"Código barras EAN", inputMode:"numeric", className:"flex-1 bg-[#FEF9F3] border border-[#F0E6DC] rounded-[12px] px-3 py-2 text-[13px]" }),
          h("button", { onClick:buscarCodigo, disabled:loadingCode, className:"bg-[#2D4A3E] text-white rounded-[12px] px-4 py-2 font-bold text-[12px]" }, loadingCode?"...":"Buscar")
        ),
        h("button", { onClick:scanning?detenerEscaner:iniciarEscaner, className:"w-full bg-[#FEF9F3] border border-[#F0E6DC] rounded-[12px] py-2 font-bold text-[12px]" }, scanning?"⏹️ Detener escáner":"📷 Escanear con cámara"),
        h("video", { ref:videoRef, className:`w-full rounded-[16px] bg-black ${scanning?"block":"hidden"}`, playsInline:true, muted:true }),
        h("div", { className:"text-[11px] opacity-60" }, "Usa BarcodeDetector + getUserMedia. Si tu navegador no lo soporta, introduce el código manualmente.")
      ),
      comidaTab === "biblioteca" && h("div", { className:"mt-4 space-y-2" },
        h("div", { className:"text-[11px] opacity-60" }, state.biblioteca.length, " alimentos en biblioteca"),
        state.biblioteca.map(a => h("button", { key:a.id, onClick:()=>seleccionarProducto({ product_name:a.nombre, brands:a.marca, code:a.code, nutriments:{"energy-kcal_100g":a.kcal100}, quantity:`${a.gramosBase}g`, kcal100:a.kcal100, gramosBase:a.gramosBase }), className:"w-full text-left flex justify-between bg-[#FEF9F3] rounded-[12px] px-3 py-2 text-[12px] border border-[#F0E6DC]/50" },
          h("span", { className:"font-bold truncate" }, a.nombre, a.marca?` · ${a.marca}`:""),
          h("span", null, a.kcal100, " kcal/100g")
        ))
      ),
      comidaTab === "manual" && h("div", { className:"mt-4 space-y-3" },
        h("input", { value:manual.nombre, onChange:e=>setManual({...manual,nombre:e.target.value}), placeholder:"Nombre alimento", className:"w-full bg-[#FEF9F3] border border-[#F0E6DC] rounded-[12px] px-3 py-2 text-[13px]" }),
        h("div", { className:"grid grid-cols-2 gap-2" },
          h("input", { value:manual.kcal100, onChange:e=>setManual({...manual,kcal100:e.target.value}), placeholder:"kcal /100g", inputMode:"decimal", className:"bg-[#FEF9F3] border border-[#F0E6DC] rounded-[12px] px-3 py-2 text-[13px]" }),
          h("input", { value:manual.gramos, onChange:e=>setManual({...manual,gramos:e.target.value}), placeholder:"gramos", inputMode:"decimal", className:"bg-[#FEF9F3] border border-[#F0E6DC] rounded-[12px] px-3 py-2 text-[13px]" })
        ),
        h("button", { onClick:addManual, className:"w-full bg-[#2D4A3E] text-white rounded-[12px] py-2 font-bold text-[12px]" }, "Añadir a hoy")
      ),
      h("div", { className:"mt-6" },
        h("div", { className:"font-bold text-[13px]" }, "Hoy · ", new Date().toLocaleDateString("es-ES"), " · ", kcalHoy, " kcal"),
        h("div", { className:"mt-2 space-y-1" },
          comidasHoy.map(c => h("div", { key:c.id, className:"flex justify-between items-center bg-[#FEF9F3] rounded-[12px] px-3 py-2 text-[12px]" },
            h("span", null, c.nombre, " · ", c.gramos, "g"),
            h("div", { className:"flex items-center gap-2" },
              h("span", { className:"font-bold" }, c.kcal, " kcal"),
              h("button", { onClick:()=>borrarItem("comidasHoy", c.id), className:"text-[#A33A32] font-bold", "aria-label":"Eliminar comida" }, "✕")
            )
          )),
          comidasHoy.length === 0 && h("div", { className:"text-[12px] opacity-60" }, "Vacío · Añade hoy")
        )
      )
    )
  );

  // ==== BALANCE ====
  const balance = h("div", { className:"bg-white rounded-[24px] p-4 shadow-[0_8px_24px_rgba(0,0,0,.07)]" },
    h("div", { className:"font-extrabold text-[16px]" }, "Balance + Adherencia"),
    h("div", { className:"mt-3 grid grid-cols-2 gap-3" },
      h("div", { className:"bg-[#FEF9F3] rounded-[14px] p-3" },
        h("div", { className:"text-[10px] opacity-60" }, "Adherencia"),
        h("div", { className:"font-bold text-[14px]" }, state.pesos.length ? "72%" : "Sin datos")
      ),
      h("div", { className:"bg-[#FEF9F3] rounded-[14px] p-3" },
        h("div", { className:"text-[10px] opacity-60" }, "Racha"),
        h("div", { className:"font-bold text-[14px]" }, state.pesos.length, " 🔥")
      )
    ),
    h("div", { className:"mt-4 text-[12px]" }, "Registra peso, comidas y entrenos para calcular adherencia, racha y balance calórico semanal."),
    h("div", { className:"mt-4 flex gap-2" },
      h("button", { onClick:()=>{
        const rows = [["fecha","peso","ingesta","quema"], ...state.pesos.map(p => [p.fecha, p.peso, "", ""])];
        const csv = rows.map(r => r.join(",")).join("\n");
        const blob = new Blob([csv], { type:"text/csv" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a"); a.href = url; a.download = "peso-pro.csv"; a.click();
      }, className:"bg-white border border-[#F0E6DC] rounded-[12px] px-3 py-2 font-bold text-[11px]" }, "CSV"),
      h("button", { onClick:()=>{
        const blob = new Blob([JSON.stringify(state, null, 2)], { type:"application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a"); a.href = url; a.download = "backup-peso-pro.json"; a.click();
      }, className:"bg-white border border-[#F0E6DC] rounded-[12px] px-3 py-2 font-bold text-[11px]" }, "Backup JSON")
    )
  );

  // ==== FOTOS ====
  const fotos = h("div", { className:"bg-white rounded-[24px] p-4 shadow-[0_8px_24px_rgba(0,0,0,.07)]" },
    h("div", { className:"font-extrabold text-[16px]" }, "Fotos Progreso"),
    h("div", { className:"mt-2 text-[12px] opacity-60" }, state.fotos.length, " fotos"),
    h("label", { className:"mt-3 w-full inline-block text-center bg-[#2D4A3E] text-white rounded-[12px] py-2 font-bold text-[12px] cursor-pointer" },
      "Añadir foto",
      h("input", { type:"file", accept:"image/*", onChange:onFoto, className:"hidden" })
    ),
    h("div", { className:"mt-4 grid grid-cols-3 gap-2" },
      state.fotos.map(f => h("div", { key:f.id, className:"relative aspect-square rounded-[12px] overflow-hidden border border-[#F0E6DC]" },
        h("img", { src:f.data, alt:"Progreso", className:"w-full h-full object-cover" }),
        h("button", { onClick:()=>borrarFoto(f.id), className:"absolute top-1 right-1 bg-black/60 text-white rounded-full w-6 h-6 text-[11px] font-bold", "aria-label":"Eliminar foto" }, "✕")
      ))
    )
  );

  // ==== MODAL alimento ====
  const modal = selected && h("div", { className:"fixed inset-0 z-[60] flex items-end md:items-center justify-center" },
    h("div", { className:"absolute inset-0 bg-black/60", onClick:()=>setSelected(null) }),
    h("div", { className:"relative w-full md:max-w-[420px] bg-[#0F172A] text-white rounded-t-[28px] md:rounded-[24px] p-5 shadow-[0_20px_60px_rgba(0,0,0,.5)] max-h-[90vh] overflow-auto" },
      h("div", { className:"flex gap-3 items-start" },
        h("img", { src:selected.image_front_small_url || selected.image_front_url, alt:"", className:"w-14 h-14 rounded-[12px] bg-white object-cover" }),
        h("div", { className:"flex-1 min-w-0" },
          h("div", { className:"font-extrabold text-[14px] leading-tight" }, selected.product_name || selected.product_name_es),
          h("div", { className:"text-[11px] opacity-70 mt-1" }, selected.brands, " ", selected.code ? `· ${selected.code}` : ""),
          h("div", { className:"text-[11px] opacity-90 mt-1" }, Math.round(kcal100), " kcal/100g · ", selected.quantity || "")
        ),
        h("button", { onClick:()=>setSelected(null), className:"w-8 h-8 rounded-full bg-white/10 flex items-center justify-center", "aria-label":"Cerrar" }, "✕")
      ),
      h("div", { className:"mt-5 space-y-4" },
        h("div", null,
          h("div", { className:"text-[11px] opacity-60 mb-2" }, "Cantidad"),
          h("div", { className:"flex items-center gap-3" },
            h("button", { onClick:()=>setCantidad(c=>Math.max(0.25, c-0.5)), className:"w-10 h-10 rounded-full bg-white/10 font-bold" }, "−"),
            h("input", { value:cantidad, onChange:e=>{ const v=parseFloat(e.target.value.replace(",",".")); if(!isNaN(v)) setCantidad(v); }, inputMode:"decimal", className:"flex-1 bg-white/10 border border-white/20 rounded-[12px] px-3 py-2 text-center font-bold" }),
            h("button", { onClick:()=>setCantidad(c=>c+0.5), className:"w-10 h-10 rounded-full bg-white/10 font-bold" }, "+")
          )
        ),
        h("div", null,
          h("div", { className:"text-[11px] opacity-60 mb-2" }, "Unidad"),
          h("select", { value:unidadIdx, onChange:e=>setUnidadIdx(parseInt(e.target.value)), className:"w-full bg-white/10 border border-white/20 rounded-[12px] px-3 py-3 text-[13px] font-semibold text-white" },
            unidades.map((u,i) => h("option", { key:i, value:i, className:"text-black" }, u.label, " · ", u.g, "g"))
          )
        ),
        h("div", { className:"bg-white/10 rounded-[16px] p-3 flex justify-between text-[13px]" },
          h("div", null,
            h("div", { className:"text-[10px] opacity-60" }, "Total gramos"),
            h("div", { className:"font-extrabold" }, Math.round(gramosTotales), " g")
          ),
          h("div", { className:"text-right" },
            h("div", { className:"text-[10px] opacity-60" }, "Total kcal"),
            h("div", { className:"font-extrabold" }, Math.round(kcalTotales), " kcal")
          )
        ),
        h("div", { className:"flex gap-2" },
          h("button", { onClick:addComida, className:"flex-1 bg-[#2D4A3E] border border-[#2D4A3E] text-white rounded-[14px] py-3 font-extrabold text-[13px]" }, "Añadir a hoy"),
          h("button", { onClick:addBiblioteca, className:"flex-1 bg-white/10 border border-white/20 rounded-[14px] py-3 font-bold text-[13px]" }, "Guardar en biblioteca")
        )
      )
    )
  );

  // ==== BOTTOM BAR ====
  const bottomBar = h("div", { className:"fixed bottom-0 left-0 right-0 z-50 pointer-events-none" },
    h("div", { className:"max-w-[980px] mx-auto px-2 pb-[max(8px,env(safe-area-inset-bottom))]" },
      h("div", { className:"bg-white rounded-t-[20px] shadow-[0_-4px_24px_rgba(0,0,0,.12)] border border-[#F0E6DC] px-2 py-2 flex gap-1 overflow-x-auto pointer-events-auto" },
        NAV.map(n => h("button", { key:n.id, onClick:()=>setTab(n.id), className:`flex-shrink-0 rounded-[12px] px-3 py-2 text-[11px] font-bold flex items-center gap-1 ${tab===n.id?"bg-[#2D4A3E] text-white":"bg-[#FEF9F3] text-[#2D4A3E]"}` },
          h("span", null, n.icon),
          h("span", { className:"whitespace-nowrap" }, n.label)
        ))
      )
    )
  );

  const fab = h("button", {
    onClick:()=>{ setTab("comidas"); setComidaTab("buscar"); window.scrollTo(0,0); },
    className:"fixed bottom-[88px] right-3 z-40 bg-[#FF8A1F] text-white rounded-full px-3 py-2.5 shadow-[0_8px_24px_rgba(255,138,31,.5)] font-extrabold text-[11px] flex items-center gap-2 max-w-[200px]",
    "aria-label":"Buscar alimento"
  },
    h("span", null, "🔍"),
    " Buscar en Mercadona / OFF"
  );

  const content = {
    home, peso, objetivo, perfil: perfilView, calculadora,
    tdee: tdeeView, metricas, entrenos: entrenosView,
    comidas: comidasView, balance, fotos
  }[tab] || home;

  return h("div", { className:"min-h-screen bg-[#FEF9F3] text-[#2D4A3E] font-sans antialiased", style:{fontFamily:"Inter, ui-sans-serif, system-ui, -apple-system, sans-serif"} },
    h("style", null, "@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');"),
    header,
    h("main", { className:"max-w-[980px] mx-auto px-4 pb-[120px] pt-4" }, content),
    modal,
    bottomBar,
    fab
  );
}

createRoot(document.getElementById("root")).render(h(React.StrictMode, null, h(App)));
</script>
</body>
</html>
